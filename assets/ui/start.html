<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether — Новая вкладка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html {
            background-color: #07040d !important;
            background: #07040d !important;
            min-height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            width: 100%;
            background-color: #07040d !important;
            background: 
                radial-gradient(circle at 50% 15%, rgba(147, 51, 234, 0.32) 0%, transparent 50%),
                radial-gradient(circle at 80% 75%, rgba(124, 58, 237, 0.20) 0%, transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                #07040d;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px 40px;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        #aether-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #9333ea, #a855f7, #38bdf8, #c084fc);
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.8), 0 0 20px rgba(147, 51, 234, 0.5);
            z-index: 2147483647;
            pointer-events: none;
            transition: width 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
            opacity: 0;
        }

        /* Кнопка настроек в правом верхнем углу */
        #aether-top-settings {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(22, 14, 42, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            color: #c084fc;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        #aether-top-settings:hover {
            background: rgba(30, 18, 58, 0.95);
            border-color: #c084fc;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        #aether-clock-wrap {
            text-align: center;
            margin-top: 18px;
            margin-bottom: 20px;
        }
        #aether-clock {
            font-size: 68px;
            font-weight: 200;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(192, 132, 252, 0.45);
        }
        #aether-date {
            font-size: 15px;
            font-weight: 400;
            color: #c084fc;
            text-transform: capitalize;
            margin-top: 4px;
        }

        #aether-logo-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .aether-emblem-svg {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.75));
        }
        #aether-logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #f8fafc 20%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Поисковая строка */
        #aether-search-container {
            width: 100%;
            max-width: 620px;
            position: relative;
            margin-bottom: 28px;
        }
        #aether-search-box {
            width: 100%;
            background: rgba(18, 12, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(168, 85, 247, 0.45);
            border-radius: 9999px;
            padding: 7px 12px 7px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(168, 85, 247, 0.2);
            transition: all 0.25s ease;
        }
        #aether-search-box:focus-within {
            border-color: #c084fc;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(192, 132, 252, 0.4);
            transform: translateY(-2px);
        }
        #aether-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #ffffff;
        }
        #aether-search-input::placeholder { color: #94a3b8; }
        #aether-search-btn {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #aether-search-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
        }

        #aether-ac-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(14, 8, 28, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(168, 85, 247, 0.25);
            overflow: hidden;
            z-index: 1000;
            display: none;
        }
        .aether-ac-item {
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }
        .aether-ac-item:last-child { border-bottom: none; }
        .aether-ac-item:hover { background: rgba(147, 51, 234, 0.28); color: #ffffff; }
        .aether-ac-icon { font-size: 16px; color: #c084fc; width: 22px; text-align: center; }
        .aether-ac-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

        /* Быстрые сервисы: гибкая центровка для аккуратного размещения 6+ карточек */
        #aether-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
            max-width: min(960px, 95vw);
            margin: 0 auto 30px;
        }
        .aether-card {
            width: 125px;
            min-height: 110px;
            background: rgba(22, 14, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            color: #f1f5f9;
            position: relative;
        }
        .aether-card:hover {
            background: rgba(30, 18, 58, 0.9);
            border-color: rgba(192, 132, 252, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(168, 85, 247, 0.35);
        }
        .aether-card:active {
            transform: scale(0.95);
            filter: brightness(1.15);
        }
        .aether-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3), rgba(124, 58, 237, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
            overflow: hidden;
        }
        .aether-card:hover .aether-card-icon { transform: scale(1.08); }
        .aether-card-svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }
        .aether-card-favicon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: contain;
        }
        .aether-card-fallback-letter {
            font-size: 19px;
            font-weight: 700;
            color: #d8b4fe;
        }
        .aether-card-name {
            font-size: 12.5px;
            font-weight: 500;
            color: #e2e8f0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }
        .aether-card-del {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .aether-card:hover .aether-card-del { display: flex; }
        .aether-card-del:hover { background: rgba(239, 68, 68, 0.8); color: #fff; transform: scale(1.1); }

        .aether-card-add {
            width: 125px;
            min-height: 110px;
            background: rgba(22, 14, 42, 0.35);
            border: 1.5px dashed rgba(168, 85, 247, 0.35);
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            color: #c084fc;
        }
        .aether-card-add:hover {
            background: rgba(30, 18, 58, 0.6);
            border-color: rgba(192, 132, 252, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 15px rgba(168, 85, 247, 0.3);
            color: #ffffff;
        }
        .aether-card-add-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .aether-card-add-name { font-size: 12.5px; font-weight: 500; text-align: center; }

        #aether-hints {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: #a78bfa;
            opacity: 0.85;
        }
        .aether-hint-pill {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 4px 10px;
            border-radius: 6px;
        }
        .aether-hint-pill b { color: #f8fafc; }

        /* Модальное окно добавления карточки */
        #aether-modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2147483647;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #aether-modal {
            background: #100a20;
            border: 1px solid rgba(168, 85, 247, 0.45);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .aether-modal-title { font-size: 18px; font-weight: 600; color: #f8fafc; display: flex; align-items: center; justify-content: space-between; }
        .aether-modal-input-group { display: flex; flex-direction: column; gap: 6px; }
        .aether-modal-label { font-size: 12px; font-weight: 500; color: #cbd5e1; }
        .aether-modal-input {
            background: rgba(22, 14, 42, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 13.5px;
            color: #ffffff;
            outline: none;
        }
        .aether-presets { display: flex; flex-wrap: wrap; gap: 6px; }
        .aether-preset-chip {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11.5px;
            color: #d8b4fe;
            cursor: pointer;
        }
        .aether-preset-chip:hover { background: rgba(168, 85, 247, 0.3); color: #fff; }
        .aether-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
        .aether-btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .aether-btn-submit {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            border: none;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Окно НАСТРОЕК */
        #aether-settings-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 2147483647;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #aether-settings-box {
            background: #0f081e;
            border: 1px solid rgba(168, 85, 247, 0.45);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 35px rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            height: 540px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .aether-settings-header {
            padding: 16px 22px;
            background: rgba(20, 12, 38, 0.8);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .aether-settings-nav {
            display: flex;
            gap: 10px;
            padding: 12px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 9, 28, 0.5);
        }
        .aether-s-tab {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all 0.15s;
        }
        .aether-s-tab.active {
            background: rgba(147, 51, 234, 0.35);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #ffffff;
            font-weight: 500;
        }
        .aether-settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 18px 22px;
        }
        .aether-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .aether-history-item:hover { background: rgba(147, 51, 234, 0.25); }
        .aether-history-del {
            color: #94a3b8;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .aether-history-del:hover { color: #fca5a5; background: rgba(239, 68, 68, 0.25); }

        /* Стили вкладки Пароли */
        .aether-pwd-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .aether-pwd-site { font-weight: 600; color: #f8fafc; font-size: 13.5px; }
        .aether-pwd-login { font-size: 12px; color: #a78bfa; margin-top: 2px; }
        .aether-pwd-actions { display: flex; align-items: center; gap: 8px; }
        .aether-pwd-btn {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11.5px;
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.15s;
        }
        .aether-pwd-btn:hover { background: rgba(168, 85, 247, 0.35); color: #fff; }
    </style>
</head>
<body>
    <div id="aether-progress-bar"></div>
    <button id="aether-top-settings" onclick="openSettings('history')">
        <span>⚙️</span> <span>Настройки</span>
    </button>

    <div id="aether-clock-wrap">
        <div id="aether-clock">--:--</div>
        <div id="aether-date">--</div>
    </div>

    <div id="aether-logo-wrap">
        <svg class="aether-emblem-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="26" fill="url(#aether_logo_bg)"/>
            <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#aether_logo_glow)" stroke-width="3"/>
            <ellipse cx="50" cy="50" rx="38" ry="18" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" transform="rotate(-25 50 50)"/>
            <path d="M38 72L50 28L62 72M42 58H58" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="72" cy="28" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 4px #fff)"/>
            <defs>
                <linearGradient id="aether_logo_bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#180730"/>
                    <stop offset="0.5" stop-color="#4c1d95"/>
                    <stop offset="1" stop-color="#7c3aed"/>
                </linearGradient>
                <linearGradient id="aether_logo_glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#c084fc"/>
                    <stop offset="1" stop-color="#38bdf8"/>
                </linearGradient>
            </defs>
        </svg>
        <span id="aether-logo-text">AETHER</span>
    </div>

    <div id="aether-search-container">
        <form id="aether-search-box" onsubmit="handleSearchSubmit(event)">
            <input id="aether-search-input" type="text" placeholder="Поиск или URL-адрес..." autocomplete="off" />
            <button id="aether-search-btn" type="submit" title="Искать">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </form>
        <div id="aether-ac-dropdown"></div>
    </div>

    <!-- Список быстрых сервисов -->
    <div id="aether-grid"></div>

    <div id="aether-hints">
        <span class="aether-hint-pill"><b>Ctrl + T</b> Новая вкладка</span>
        <span class="aether-hint-pill"><b>Ctrl + W</b> Закрыть вкладку</span>
        <span class="aether-hint-pill"><b>Ctrl + B</b> Скрыть / открыть сайдбар</span>
        <span class="aether-hint-pill"><b>Ctrl + H</b> Домой</span>
        <span class="aether-hint-pill"><b>ПКМ по видео</b> Скачать / PiP / Аудио</span>
    </div>

    <!-- Модальное окно добавления сервиса -->
    <div id="aether-modal-backdrop">
        <div id="aether-modal">
            <div class="aether-modal-title">
                <span>Добавить быстрый сервис</span>
                <span onclick="closeAddModal()" style="cursor:pointer; color:#94a3b8; font-size:16px;">✕</span>
            </div>
            <div id="aether-modal-presets-wrap"></div>
            <div class="aether-modal-input-group">
                <label class="aether-modal-label">Название сервиса</label>
                <input id="modal-name" class="aether-modal-input" placeholder="например, YouTube" autocomplete="off" />
            </div>
            <div class="aether-modal-input-group">
                <label class="aether-modal-label">URL адрес</label>
                <input id="modal-url" class="aether-modal-input" placeholder="например, vk.ru или youtube.com" autocomplete="off" />
            </div>
            <div class="aether-modal-actions">
                <button type="button" class="aether-btn-cancel" onclick="closeAddModal()">Отмена</button>
                <button type="button" class="aether-btn-submit" onclick="submitAddCard()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Окно НАСТРОЕК -->
    <div id="aether-settings-modal">
        <div id="aether-settings-box">
            <div class="aether-settings-header">
                <div style="font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;">
                    <span>⚙️</span> <span>Настройки</span>
                </div>
                <span onclick="closeSettings()" style="cursor:pointer; color:#94a3b8; font-size:16px;">✕</span>
            </div>
            <div class="aether-settings-nav">
                <span class="aether-s-tab active" id="tab-btn-history" onclick="switchSettingsTab('history')">🕒 История</span>
                <span class="aether-s-tab" id="tab-btn-passwords" onclick="switchSettingsTab('passwords')">🔑 Пароли</span>
                <span class="aether-s-tab" id="tab-btn-ui" onclick="switchSettingsTab('ui')">🎛️ Боковая панель</span>
                <span class="aether-s-tab" id="tab-btn-diag" onclick="switchSettingsTab('diag')">📁 Логи и Диагностика</span>
            </div>
            <div class="aether-settings-content" id="settings-content-area"></div>
        </div>
    </div>

    <script>
        function log(msg) {
            if (window.ipc && window.ipc.postMessage) {
                try { window.ipc.postMessage("log:" + msg); } catch (_) {}
            }
        }
        log("Стартовая страница загружена (http://aether.localhost/)");

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('aether-clock').textContent = hours + ':' + minutes;
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('aether-date').textContent = now.toLocaleDateString('ru-RU', options);
        }
        // Часы показывают только часы:минуты — просыпаемся раз в минуту, а не каждую секунду
        function tickClock() {
            updateClock();
            setTimeout(tickClock, 60000 - (Date.now() % 60000) + 50);
        }
        tickClock();

        const POPULAR_SITES = [
            { name: 'YouTube', domain: 'youtube.com', url: 'https://www.youtube.com', icon: '▶' },
            { name: 'ВКонтакте', domain: 'vk.com', url: 'https://vk.com', icon: 'VK' },
            { name: 'Telegram', domain: 'web.telegram.org', url: 'https://web.telegram.org', icon: '✈' },
            { name: 'GitHub', domain: 'github.com', url: 'https://github.com', icon: '🐙' },
            { name: 'Twitch', domain: 'twitch.tv', url: 'https://www.twitch.tv', icon: '🎮' },
            { name: 'Кинопоиск', domain: 'kinopoisk.ru', url: 'https://www.kinopoisk.ru', icon: '🎬' },
            { name: 'Яндекс', domain: 'ya.ru', url: 'https://ya.ru', icon: 'Я' },
            { name: 'Google', domain: 'google.com', url: 'https://google.com', icon: 'G' },
            { name: 'Rutube', domain: 'rutube.ru', url: 'https://rutube.ru', icon: '📺' },
            { name: 'Reddit', domain: 'reddit.com', url: 'https://reddit.com', icon: '🤖' },
            { name: 'Википедия', domain: 'wikipedia.org', url: 'https://ru.wikipedia.org', icon: 'W' },
            { name: 'ChatGPT', domain: 'chatgpt.com', url: 'https://chatgpt.com', icon: '💬' }
        ];

        function triggerLoadProgress() {
            let bar = document.getElementById('aether-progress-bar');
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'aether-progress-bar';
                document.body.appendChild(bar);
            }
            bar.style.opacity = '1';
            bar.style.width = '35%';
            setTimeout(() => {
                if (bar.style.opacity === '1') bar.style.width = '75%';
            }, 100);
        }

        function completeLoadProgress() {
            const bar = document.getElementById('aether-progress-bar');
            if (bar) {
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => { bar.style.width = '0%'; }, 200);
                }, 150);
            }
        }

        function getHistory() {
            try {
                const raw = localStorage.getItem('aether_search_history');
                if (raw) return JSON.parse(raw);
            } catch (_) {}
            return [];
        }

        function saveHistoryItem(val, type = 'query') {
            if (!val || typeof val !== 'string') return;
            const text = val.trim();
            if (!text) return;
            try {
                let list = getHistory();
                const existing = list.find(item => item.val.toLowerCase() === text.toLowerCase());
                const visits = (existing && existing.visits) ? existing.visits + 1 : 1;
                list = list.filter(item => item.val.toLowerCase() !== text.toLowerCase());
                list.unshift({ val: text, type: type, ts: Date.now(), visits: visits });
                if (list.length > 100) list.pop();
                localStorage.setItem('aether_search_history', JSON.stringify(list));

                // Также сохраняем домен в отдельный реестр посещений
                if (text.includes('.')) {
                    let domain = text.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
                    if (domain) {
                        let visitsMap = {};
                        try {
                            const rawMap = localStorage.getItem('aether_site_visits');
                            if (rawMap) visitsMap = JSON.parse(rawMap);
                        } catch (_) {}
                        visitsMap[domain] = (visitsMap[domain] || 0) + 1;
                        localStorage.setItem('aether_site_visits', JSON.stringify(visitsMap));
                    }
                }
            } catch (_) {}
        }

        function deleteHistoryItem(val) {
            try {
                let list = getHistory();
                list = list.filter(item => item.val.toLowerCase() !== val.toLowerCase());
                localStorage.setItem('aether_search_history', JSON.stringify(list));
                renderHistoryTab();
            } catch (_) {}
        }

        function showToast(text) {
            let t = document.getElementById('aether-start-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'aether-start-toast';
                t.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(20,12,40,0.96); border:1px solid rgba(168,85,247,0.6); box-shadow:0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(168,85,247,0.4); color:#ffffff; padding:10px 22px; border-radius:10px; font-size:13.5px; font-weight:500; z-index:2147483647; display:none; backdrop-filter:blur(14px); transition:opacity 0.25s ease;";
                document.body.appendChild(t);
            }
            t.textContent = text;
            t.style.display = 'block';
            t.style.opacity = '1';
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => { t.style.display = 'none'; }, 250);
            }, 2200);
        }

        function showClearHistoryConfirm(e) {
            if (e) e.stopPropagation();
            const banner = document.getElementById('aether-history-confirm-banner');
            const btn = document.getElementById('btn-show-clear-history');
            if (banner) {
                banner.style.display = 'block';
                if (btn) btn.style.display = 'none';
                setTimeout(() => {
                    const onOutsideClick = (evt) => {
                        const b = document.getElementById('aether-history-confirm-banner');
                        if (b && b.style.display === 'block') {
                            if (!b.contains(evt.target)) {
                                cancelClearHistory();
                                document.removeEventListener('click', onOutsideClick);
                            }
                        } else {
                            document.removeEventListener('click', onOutsideClick);
                        }
                    };
                    document.addEventListener('click', onOutsideClick);
                }, 20);
            }
        }

        function cancelClearHistory(e) {
            if (e) e.stopPropagation();
            const banner = document.getElementById('aether-history-confirm-banner');
            const btn = document.getElementById('btn-show-clear-history');
            if (banner) banner.style.display = 'none';
            if (btn) btn.style.display = 'inline-flex';
        }

        function executeClearAllHistory(e) {
            if (e) e.stopPropagation();
            try {
                localStorage.removeItem('aether_search_history');
                localStorage.removeItem('aether_site_visits');
            } catch (_) {}
            renderHistoryTab();
            showToast('🗑️ История успешно очищена');
        }

        function clearAllHistory() {
            showClearHistoryConfirm();
        }

        function navigateTo(target) {
            if (!target) return;
            let url = target.trim();
            triggerLoadProgress();
            saveHistoryItem(url, url.startsWith('http') ? 'url' : 'query');

            let dest = url;
            if (url.toLowerCase().startsWith("yt:") || url.toLowerCase().startsWith("ютуб:")) {
                dest = "https://www.youtube.com/results?search_query=" + encodeURIComponent(url.replace(/^(yt:|ютуб:)/i, "").trim());
            } else if (url.toLowerCase().startsWith("vk:") || url.toLowerCase().startsWith("вк:")) {
                dest = "https://vk.com/search?c%5Bsection%5D=auto&c%5Bq%5D=" + encodeURIComponent(url.replace(/^(vk:|вк:)/i, "").trim());
            } else if (url.toLowerCase().startsWith("gh:")) {
                dest = "https://github.com/search?q=" + encodeURIComponent(url.replace(/^gh:/i, "").trim());
            } else {
                const isUrl = url.startsWith("http://") || url.startsWith("https://") || (url.includes(".") && !url.includes(" ") && !url.endsWith("."));
                if (isUrl) {
                    dest = (url.startsWith("http://") || url.startsWith("https://")) ? url : "https://" + url;
                } else {
                    dest = "https://www.google.com/search?q=" + encodeURIComponent(url);
                }
            }

            log("Стартовая страница навигация к: " + dest);
            if (window.ipc && window.ipc.postMessage) {
                try {
                    window.ipc.postMessage("navigate:" + dest);
                    return;
                } catch (_) {}
            }
            window.location.href = dest;
        }

        function handleSearchSubmit(e) {
            e.preventDefault();
            navigateTo(document.getElementById('aether-search-input').value);
        }

        // Автодополнение популярных сайтов
        const searchInput = document.getElementById('aether-search-input');
        const acDropdown = document.getElementById('aether-ac-dropdown');

        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim().toLowerCase();
            acDropdown.innerHTML = '';
            if (!val) {
                acDropdown.style.display = 'none';
                return;
            }

            const items = [];
            POPULAR_SITES.filter(s => s.domain.includes(val) || s.name.toLowerCase().includes(val)).slice(0, 4).forEach(s => {
                items.push({ text: s.name + ' (' + s.domain + ')', target: s.url, icon: s.icon });
            });
            items.push({ text: `Искать в Google: "${searchInput.value.trim()}"`, target: searchInput.value.trim(), icon: '🔍' });
            items.push({ text: `Искать на YouTube: "${searchInput.value.trim()}"`, target: "yt: " + searchInput.value.trim(), icon: '▶' });

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'aether-ac-item';
                el.innerHTML = `<span class="aether-ac-icon">${item.icon}</span><span class="aether-ac-text">${item.text}</span>`;
                el.onclick = () => { navigateTo(item.target); };
                acDropdown.appendChild(el);
            });
            acDropdown.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('aether-search-container').contains(e.target)) {
                acDropdown.style.display = 'none';
            }
        });

        // --- Управление карточками ---
        function getCustomCards() {
            try {
                if (window.name && window.name.startsWith("__AETHER_STATE__=")) {
                    const parsed = JSON.parse(window.name.substring(17));
                    if (parsed && Array.isArray(parsed.cards)) return parsed.cards;
                }
            } catch (_) {}
            try {
                const local = localStorage.getItem('aether_custom_cards');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (_) {}
            return [];
        }

        function saveCustomCards(cards) {
            try { localStorage.setItem('aether_custom_cards', JSON.stringify(cards)); } catch (_) {}
            try {
                if (window.name && window.name.startsWith("__AETHER_STATE__=")) {
                    const parsed = JSON.parse(window.name.substring(17));
                    parsed.cards = cards;
                    window.name = "__AETHER_STATE__=" + JSON.stringify(parsed);
                }
            } catch (_) {}
            if (window.ipc && window.ipc.postMessage) {
                try { window.ipc.postMessage("save_cards:" + JSON.stringify(cards)); } catch (_) {}
            }
            renderGrid();
        }

        function getServiceIcon(name, url) {
            const cleanUrl = (url || '').toLowerCase();
            const cleanName = (name || '').toLowerCase();
            if (cleanUrl.includes('youtube.com') || cleanUrl.includes('youtu.be') || cleanName.includes('youtube') || cleanName.includes('ютуб')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#ef4444;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
            }
            if (cleanUrl.includes('vk.com') || cleanName.includes('vk') || cleanName.includes('вк')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#2787f5;"><path d="M12.785 17.5c-5.467 0-8.583-3.746-8.713-9.98h2.729c.09 4.575 2.1 6.51 3.7 6.91V7.52h2.569v3.945c1.572-.17 3.22-1.96 3.78-3.945h2.568c-.43 2.45-2.24 4.24-3.52 4.98 1.28.6 3.32 2.15 4.07 5.0h-2.83c-.59-1.84-2.06-3.26-4.01-3.46v3.46h-.063z"/></svg>`;
            }
            if (cleanUrl.includes('telegram') || cleanUrl.includes('t.me') || cleanName.includes('telegram') || cleanName.includes('телеграм')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#229ed9;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .34z"/></svg>`;
            }
            if (cleanUrl.includes('github.com') || cleanName.includes('github')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#f8fafc;"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>`;
            }
            if (cleanUrl.includes('twitch.tv') || cleanName.includes('twitch')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#a855f7;"><path d="M2.149 0L.537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612l-3.582 3.582h-5.015L9.672 20.24v-3.045H5.194V2.149h16.119v11.463zm-9.313-7.522h2.149v6.09h-2.149v-6.09zm5.373 0h2.149v6.09h-2.149v-6.09z"/></svg>`;
            }
            if (cleanUrl.includes('kinopoisk.ru') || cleanName.includes('кинопоиск')) {
                return `<svg viewBox="0 0 24 24" class="aether-card-svg" style="fill:#f97316;"><circle cx="12" cy="12" r="10" fill="#f97316"/><path d="M8 6h3v4.5l3.5-4.5h3.8l-4.5 5.5 4.8 6.5h-3.8l-3.8-5.3V18H8V6z" fill="#000"/></svg>`;
            }

            let domain = '';
            try {
                domain = new URL(url.startsWith('http') ? url : 'https://' + url).hostname.replace(/^www\./, '');
            } catch (_) {
                domain = cleanUrl.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
            }
            const letter = (name || 'S').trim().charAt(0).toUpperCase();
            if (domain && domain.includes('.')) {
                return `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" class="aether-card-favicon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="aether-card-fallback-letter" style="display:none;">${letter}</div>`;
            }
            return `<div class="aether-card-fallback-letter">${letter}</div>`;

        function renderGrid() {
            const grid = document.getElementById('aether-grid');
            grid.innerHTML = '';
            const cards = getCustomCards();

            const addBtn = document.createElement('div');
            addBtn.className = 'aether-card-add';
            addBtn.onclick = openAddModal;
            addBtn.title = 'Добавить быстрый сервис';
            addBtn.innerHTML = `
                <div class="aether-card-add-icon">+</div>
                <div class="aether-card-add-name">Добавить сервис</div>
            `;
            grid.appendChild(addBtn);

            cards.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'aether-card';
                el.onclick = () => { navigateTo(card.url); };

                const icon = document.createElement('div');
                icon.className = 'aether-card-icon';
                icon.innerHTML = getServiceIcon(card.name, card.url);

                const name = document.createElement('div');
                name.className = 'aether-card-name';
                name.textContent = card.name;

                const del = document.createElement('div');
                del.className = 'aether-card-del';
                del.textContent = '✕';
                del.title = 'Удалить';
                del.onclick = (e) => {
                    e.stopPropagation();
                    const newCards = cards.filter((_, i) => i !== index);
                    saveCustomCards(newCards);
                };

                el.appendChild(del);
                el.appendChild(icon);
                el.appendChild(name);
                grid.appendChild(el);
            });
        }

        function renderModalPresets() {
            const wrap = document.getElementById('aether-modal-presets-wrap');
            if (!wrap) return;

            // Считываем реестр посещений
            let visitsMap = {};
            try {
                const storedVisits = localStorage.getItem('aether_site_visits');
                if (storedVisits) visitsMap = JSON.parse(storedVisits);
            } catch (_) {}

            try {
                if (window.name && window.name.startsWith("__AETHER_STATE__=")) {
                    const parsed = JSON.parse(window.name.substring(17));
                    if (parsed.visits) {
                        for (const [k, v] of Object.entries(parsed.visits)) {
                            visitsMap[k] = Math.max(visitsMap[k] || 0, v);
                        }
                    }
                }
            } catch (_) {}

            // Проверяем историю
            const historyList = getHistory();
            historyList.forEach(item => {
                if (item.visits && item.val && item.val.includes('.')) {
                    let d = item.val.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
                    visitsMap[d] = Math.max(visitsMap[d] || 0, item.visits);
                }
            });

            // Сайты с 3+ визитами
            const frequent = Object.entries(visitsMap)
                .filter(([domain, count]) => count >= 3 && domain.includes('.'))
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            let html = '';
            if (frequent.length > 0) {
                html += `<div style="font-size:11px; font-weight:600; color:#c084fc; margin-bottom:5px; display:flex; align-items:center; gap:5px;">
                    <span>⭐</span> <span>Часто посещаемые сайты (3+ визитов):</span>
                </div>
                <div class="aether-presets" style="margin-bottom:12px;">`;
                frequent.forEach(([domain, count]) => {
                    let baseName = domain.split('.')[0];
                    baseName = baseName.charAt(0).toUpperCase() + baseName.slice(1);
                    const fullUrl = 'https://' + domain;
                    html += `<span class="aether-preset-chip" style="border-color:rgba(192,132,252,0.6); background:rgba(168,85,247,0.22); color:#f3e8ff;" onclick="applyPreset('${baseName}', '${fullUrl}')">⭐ ${domain} (${count})</span>`;
                });
                html += `</div>`;
            }

            html += `<div style="font-size:11px; font-weight:600; color:#94a3b8; margin-bottom:5px;">Популярные сервисы:</div>
            <div class="aether-presets">
                <span class="aether-preset-chip" onclick="applyPreset('YouTube', 'https://www.youtube.com')">YouTube</span>
                <span class="aether-preset-chip" onclick="applyPreset('ВКонтакте', 'https://vk.com')">ВКонтакте</span>
                <span class="aether-preset-chip" onclick="applyPreset('Telegram', 'https://web.telegram.org')">Telegram</span>
                <span class="aether-preset-chip" onclick="applyPreset('GitHub', 'https://github.com')">GitHub</span>
                <span class="aether-preset-chip" onclick="applyPreset('Twitch', 'https://www.twitch.tv')">Twitch</span>
                <span class="aether-preset-chip" onclick="applyPreset('Кинопоиск', 'https://www.kinopoisk.ru')">Кинопоиск</span>
            </div>`;

            wrap.innerHTML = html;
        }

        function openAddModal() {
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-url').value = '';
            renderModalPresets();
            document.getElementById('aether-modal-backdrop').style.display = 'flex';
            document.getElementById('modal-name').focus();
        }
        function closeAddModal() { document.getElementById('aether-modal-backdrop').style.display = 'none'; }
        function applyPreset(name, url) {
            document.getElementById('modal-name').value = name;
            document.getElementById('modal-url').value = url;
        }
        function submitAddCard() {
            const name = document.getElementById('modal-name').value.trim();
            let url = document.getElementById('modal-url').value.trim();
            if (!name || !url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            const cards = getCustomCards();
            cards.push({ id: Date.now().toString(), name, url });
            saveCustomCards(cards);
            closeAddModal();
        }

        // --- Менеджер паролей ---
        function getPasswords() {
            try {
                const raw = localStorage.getItem('aether_passwords');
                if (raw) return JSON.parse(raw);
            } catch (_) {}
            return [];
        }

        function savePasswords(list) {
            try { localStorage.setItem('aether_passwords', JSON.stringify(list)); } catch (_) {}
            renderPasswordsTab();
        }

        function addPassword(site, login, pass) {
            if (!site || !login || !pass) return;
            const list = getPasswords();
            list.push({ id: Date.now().toString(), site, login, pass });
            savePasswords(list);
        }

        function deletePassword(id) {
            const list = getPasswords().filter(p => p.id !== id);
            savePasswords(list);
        }

        // --- Окно настроек ---
        function openSettings(tab = 'history') {
            document.getElementById('aether-settings-modal').style.display = 'flex';
            switchSettingsTab(tab);
        }
        function closeSettings() {
            document.getElementById('aether-settings-modal').style.display = 'none';
        }

        function switchSettingsTab(tab) {
            document.querySelectorAll('.aether-s-tab').forEach(el => el.classList.remove('active'));
            const tabBtn = document.getElementById('tab-btn-' + tab);
            if (tabBtn) tabBtn.classList.add('active');

            if (tab === 'history') renderHistoryTab();
            else if (tab === 'passwords') renderPasswordsTab();
            else if (tab === 'ui') renderUiTab();
            else if (tab === 'diag') renderDiagTab();
        }

        function renderHistoryTab() {
            const area = document.getElementById('settings-content-area');
            const history = getHistory();

            if (history.length === 0) {
                area.innerHTML = `
                    <div style="text-align:center; padding: 40px; color:#94a3b8;">
                        <div style="font-size:32px; margin-bottom:10px;">🕒</div>
                        <div>История поиска и переходов пуста</div>
                    </div>
                `;
                return;
            }

            let html = `
                <div id="aether-history-toolbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span style="font-size:13px; color:#cbd5e1;">Всего записей: ${history.length}</span>
                    <button id="btn-show-clear-history" type="button" onclick="showClearHistoryConfirm(event)" style="background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.45); color:#fca5a5; padding:5px 12px; border-radius:7px; cursor:pointer; font-size:12px; transition:all 0.15s; display:inline-flex; align-items:center; gap:5px;">🗑️ Очистить всю историю</button>
                </div>

                <!-- Предупреждающая плашка в тёмно-фиолетовом стиле браузера -->
                <div id="aether-history-confirm-banner" style="display:none; background:rgba(30, 14, 42, 0.96); border:1.5px solid rgba(239, 68, 68, 0.65); box-shadow:0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(239,68,68,0.3); border-radius:12px; padding:14px 16px; margin-bottom:14px; backdrop-filter:blur(10px);">
                    <div style="display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#fecaca; margin-bottom:12px; line-height:1.45;">
                        <span style="font-size:20px; line-height:1;">⚠️</span>
                        <div>
                            <div style="font-weight:600; color:#fff; font-size:13.5px;">Очистить всю историю?</div>
                            <div style="color:#fca5a5; font-size:12px; margin-top:2px;">Вы уверены, что хотите удалить историю поиска и визитов? Это действие нельзя отменить.</div>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:8px;">
                        <button type="button" onclick="cancelClearHistory(event)" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); color:#cbd5e1; padding:6px 14px; border-radius:7px; font-size:12px; cursor:pointer; transition:background 0.15s;">Отмена</button>
                        <button type="button" onclick="executeClearAllHistory(event)" style="background:linear-gradient(135deg, #ef4444, #dc2626); border:none; color:#ffffff; padding:6px 16px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; box-shadow:0 2px 12px rgba(239,68,68,0.45); transition:transform 0.1s;">🗑️ Да, удалить</button>
                    </div>
                </div>
            `;

            history.forEach(item => {
                const date = new Date(item.ts).toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
                html += `
                    <div class="aether-history-item" onclick="navigateTo('${item.val.replace(/'/g, "\\'")}')">
                        <div style="display:flex; align-items:center; gap:8px; overflow:hidden;">
                            <span>${item.type === 'url' ? '🌐' : '🔍'}</span>
                            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.val}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
                            <span style="font-size:11px; color:#94a3b8;">${date}</span>
                            <span class="aether-history-del" onclick="event.stopPropagation(); deleteHistoryItem('${item.val.replace(/'/g, "\\'")}')">✕</span>
                        </div>
                    </div>
                `;
            });
            area.innerHTML = html;
        }

        function renderPasswordsTab() {
            const area = document.getElementById('settings-content-area');
            const pwds = getPasswords();

            let html = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <span style="font-size:13px; color:#cbd5e1;">Сохранено паролей: ${pwds.length}</span>
                    <button onclick="showAddPasswordForm()" style="background:linear-gradient(135deg,#9333ea,#7c3aed); border:none; color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:500;">+ Добавить пароль</button>
                </div>

                <div id="add-pwd-form-wrap" style="display:none; background:rgba(255,255,255,0.04); border:1px solid rgba(168,85,247,0.3); border-radius:10px; padding:14px; margin-bottom:14px;">
                    <div style="font-weight:600; font-size:13px; margin-bottom:8px; color:#e2e8f0;">Новый аккаунт</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
                        <input id="np-site" placeholder="Сайт (например, vk.com)" style="background:rgba(20,12,38,0.9); border:1px solid rgba(168,85,247,0.3); border-radius:6px; padding:6px 10px; color:#fff; font-size:12px; outline:none;" />
                        <input id="np-login" placeholder="Логин или Email" style="background:rgba(20,12,38,0.9); border:1px solid rgba(168,85,247,0.3); border-radius:6px; padding:6px 10px; color:#fff; font-size:12px; outline:none;" />
                    </div>
                    <div style="display:flex; gap:8px;">
                        <input id="np-pass" type="password" placeholder="Пароль" style="flex:1; background:rgba(20,12,38,0.9); border:1px solid rgba(168,85,247,0.3); border-radius:6px; padding:6px 10px; color:#fff; font-size:12px; outline:none;" />
                        <button onclick="submitNewPassword()" style="background:#9333ea; border:none; color:#fff; border-radius:6px; padding:6px 14px; cursor:pointer; font-size:12px;">Сохранить</button>
                        <button onclick="document.getElementById('add-pwd-form-wrap').style.display='none'" style="background:rgba(255,255,255,0.1); border:none; color:#cbd5e1; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px;">Отмена</button>
                    </div>
                </div>
            `;

            if (pwds.length === 0) {
                html += `
                    <div style="text-align:center; padding: 30px; color:#94a3b8;">
                        <div style="font-size:32px; margin-bottom:8px;">🔑</div>
                        <div>Нет сохраненных паролей</div>
                    </div>
                `;
            } else {
                pwds.forEach(p => {
                    html += `
                        <div class="aether-pwd-card">
                            <div>
                                <div class="aether-pwd-site">🌐 ${p.site}</div>
                                <div class="aether-pwd-login">Логин: <b>${p.login}</b></div>
                            </div>
                            <div class="aether-pwd-actions">
                                <span id="pwd-val-${p.id}" style="font-family:monospace; font-size:12.5px; color:#c084fc; letter-spacing:2px;">••••••••</span>
                                <button class="aether-pwd-btn" title="Показать/скрыть" onclick="togglePasswordVisibility('${p.id}', '${p.pass.replace(/'/g, "\\'")}')">👁️</button>
                                <button class="aether-pwd-btn" title="Скопировать пароль" onclick="navigator.clipboard.writeText('${p.pass.replace(/'/g, "\\'")}'); showToast('📋 Пароль скопирован в буфер!');">📋 Пароль</button>
                                <button class="aether-pwd-btn" title="Скопировать логин" onclick="navigator.clipboard.writeText('${p.login.replace(/'/g, "\\'")}'); showToast('📋 Логин скопирован в буфер!');">📋 Логин</button>
                                <button class="aether-pwd-btn" style="color:#fca5a5;" title="Удалить" onclick="deletePassword('${p.id}')">✕</button>
                            </div>
                        </div>
                    `;
                });
            }

            area.innerHTML = html;
        }

        function showAddPasswordForm() {
            const form = document.getElementById('add-pwd-form-wrap');
            if (form) form.style.display = 'block';
        }

        function submitNewPassword() {
            const site = document.getElementById('np-site').value.trim();
            const login = document.getElementById('np-login').value.trim();
            const pass = document.getElementById('np-pass').value.trim();
            if (!site || !login || !pass) {
                showToast('⚠️ Пожалуйста, заполните все поля!');
                return;
            }
            addPassword(site, login, pass);
            showToast('🔑 Пароль сохранён!');
            document.getElementById('add-pwd-form-wrap').style.display = 'none';
        }

        function togglePasswordVisibility(id, realPass) {
            const span = document.getElementById('pwd-val-' + id);
            if (!span) return;
            if (span.textContent === '••••••••') {
                span.textContent = realPass;
                span.style.letterSpacing = '0.5px';
            } else {
                span.textContent = '••••••••';
                span.style.letterSpacing = '2px';
            }
        }

        function renderUiTab() {
            const area = document.getElementById('settings-content-area');
            const currentMode = localStorage.getItem('aether_sidebar_mode') || 'autohide';
            area.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div>
                        <div style="font-weight:600; font-size:14px; margin-bottom:6px;">Режим боковой панели (Arc Style)</div>
                        <div style="font-size:12.5px; color:#94a3b8; margin-bottom:12px;">Выберите, как боковая панель ведёт себя на открытых сайтах:</div>
                    </div>
                    <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; background:rgba(255,255,255,0.03); padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.08);">
                        <input type="radio" name="sb_mode" value="autohide" ${currentMode === 'autohide' ? 'checked' : ''} onchange="setSidebarMode('autohide')" />
                        <div>
                            <div style="font-weight:500; color:#fff;">✨ Авто-скрытие (Floating / Arc Style) — Рекомендуется</div>
                            <div style="font-size:12px; color:#94a3b8; margin-top:2px;">Сайт отображается на все 100% экрана, ничего не сдвигается и не перекрывается. Панель плавно выезжает поверх экрана при наведении на левый край или по Ctrl+B.</div>
                        </div>
                    </label>
                    <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; background:rgba(255,255,255,0.03); padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.08);">
                        <input type="radio" name="sb_mode" value="pinned" ${currentMode === 'pinned' ? 'checked' : ''} onchange="setSidebarMode('pinned')" />
                        <div>
                            <div style="font-weight:500; color:#fff;">📌 Закрепленная панель (Pinned)</div>
                            <div style="font-size:12px; color:#94a3b8; margin-top:2px;">Панель всегда видна слева на экране.</div>
                        </div>
                    </label>
                </div>
            `;
        }

        function setSidebarMode(mode) {
            localStorage.setItem('aether_sidebar_mode', mode);
            log("Изменен режим сайдбара: " + mode);
        }

        function renderDiagTab() {
            const area = document.getElementById('settings-content-area');
            area.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <div style="font-weight:600; font-size:14px;">📁 Диагностика и логирование</div>
                    <div style="font-size:13px; color:#cbd5e1; line-height:1.5;">
                        Все события, переходы, клики по кнопке «Домой» и ошибки автоматически записываются в реальном времени в файл лога на вашем Рабочем столе:
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="flex:1; background:rgba(20,12,38,0.9); border:1px solid rgba(168,85,247,0.3); border-radius:8px; padding:10px 14px; font-family:monospace; font-size:12px; color:#c084fc;">
                            %USERPROFILE%\\Desktop\\aether_debug.log
                        </div>
                        <button onclick="openLogInExplorer()" style="background:linear-gradient(135deg,#9333ea,#7c3aed); border:none; border-radius:8px; padding:10px 14px; color:#fff; font-size:12px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:0 4px 15px rgba(147,51,234,0.4);" title="Открыть Проводник и выделить файл">
                            <span>📂</span> <span>Показать файл на Рабочем столе</span>
                        </button>
                    </div>
                    <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
                        Нажатие на кнопку сразу откроет Проводник Windows и подсветит файл лога.
                    </div>
                </div>
            `;
        }

        function openLogInExplorer() {
            log("Запрос открытия проводника с лог-файлом");
            if (window.ipc && window.ipc.postMessage) {
                try {
                    window.ipc.postMessage("open_log_in_explorer");
                } catch (_) {}
            }
        }

        renderGrid();
        setTimeout(() => {
            const si = document.getElementById('aether-search-input');
            if (si) {
                try { si.focus({ preventScroll: true }); } catch (_) { si.focus(); }
            }
        }, 60);
    </script>
</body>
</html>

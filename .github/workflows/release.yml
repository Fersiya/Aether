name: Release Aether Browser

# Релиз создаётся автоматически: пуш в main с новой версией в Cargo.toml
# -> сборка под Windows -> тег v<версия> и GitHub Release создаёт сам Actions.
# Если релиз с такой версией уже есть, сборка пропускается.
# Ручной запуск (workflow_dispatch) только проверяет сборку и ничего не публикует.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version and check for an existing release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$version" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Версия v$version ещё не выпущена — будет создан релиз."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Релиз не нужен (версия v$version уже выпущена или это ручной запуск)."
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare artifact
        shell: bash
        run: cp target/release/aether-browser.exe aether-browser-windows.exe

      - name: Publish GitHub Release
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aether Browser v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: aether-browser-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

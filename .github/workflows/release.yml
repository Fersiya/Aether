name: Release Aether Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: aether-browser-windows.exe
            binary_path: target/release/aether-browser.exe
          - os: ubuntu-22.04
            artifact_name: aether-browser-linux
            binary_path: target/release/aether-browser
          - os: macos-latest
            artifact_name: aether-browser-macos
            binary_path: target/release/aether-browser

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev build-essential

      - name: Build release binary
        run: cargo build --release

      - name: Prepare binary artifact
        shell: bash
        run: |
          cp ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

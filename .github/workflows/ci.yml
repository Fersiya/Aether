name: CI

# Проверка компиляции под Windows для всех веток, кроме main (main собирает release.yml).
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  check-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        shell: bash
        run: |
          set +e
          cargo check --release --message-format short 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error" check.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          grep -E "warning" check.log | head -15 | while IFS= read -r line; do echo "::warning::${line}"; done
          exit "$status"

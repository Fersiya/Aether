[package]
name = "aether-browser"
version = "0.6.3"
edition = "2021"
authors = ["Aether Team"]
description = "Aether Browser — Ультралегкий и быстрый медиа-браузер на Rust с защитой от рекламы, интеграцией Google, YouTube, VK и медиа-контролем."

[dependencies]
tao = "0.30"
wry = "0.47"
directories = "5.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

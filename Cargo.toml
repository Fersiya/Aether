[package]
name = "aether-browser"
version = "0.5.0"
edition = "2021"
authors = ["Aether Team"]
description = "Aether Browser — Ультралегкий браузер на Rust с поддержкой многовкладочности, режимом инкогнито, медиа-контролем и скачиванием видео."

[dependencies]
tao = "0.30"
wry = "0.47"
directories = "5.0"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

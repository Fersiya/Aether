[package]
name = "aether-browser"
version = "0.7.0"
edition = "2021"
authors = ["Aether Team", "Claude <noreply@anthropic.com>"]
description = "Aether Browser — Ультралегкий и быстрый медиа-браузер на Rust с защитой от рекламы, интеграцией Google, YouTube, VK и медиа-контролем."

[dependencies]
tao = "0.30"
wry = "0.47"
directories = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
